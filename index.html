<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мария Евтодиева — Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", monospace;
      background-color: #f2f2f2;
      color: #000;
    }

    /* HEADER */
    header {
      height: 70px;
      width: 100%;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #e8e8e8;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      text-transform: lowercase;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.5;
    }

    /* ABOUT SECTION */
    .about {
      padding: 40px;
    }

    .about h1 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 30px;
    }

    .about-content {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .about-photo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background-color: #d0d0d0;
      flex-shrink: 0;
      overflow: hidden;
    }

    .about-text {
      max-width: 600px;
      font-size: 18px;
      line-height: 1.6;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      header {
        padding: 0 20px;
      }

      .logo {
        font-size: 13px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 12px;
      }

      .about {
        padding: 40px 20px;
      }

      .about h1 {
        font-size: 20px;
      }

      .about-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }

      .about-photo {
        width: 160px;
        height: 160px;
      }

      .about-text {
        font-size: 16px;
      }
    }
    /* CONTACTS */
.contacts {
  padding: 40px;
  margin-top: 40px;
  background-color: #e8e8e8;
}

.contacts h1 {
  font-size: 24px;
  font-weight: 400;
  margin-bottom: 30px;
}

.contacts-links {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
}

.contacts-links a {
  color: #000;
  text-decoration: none;
  font-size: 16px;
  transition: opacity 0.2s ease;
}

.contacts-links a:hover {
  opacity: 0.5;
}

.contacts-footer {
  margin-top: 60px;
  padding-top: 20px;
  border-top: 1px solid #bdbdbd;
  font-size: 12px;
}

/* MOBILE */
@media (max-width: 600px) {
  .contacts {
    padding: 40px 20px;
  }

  .contacts h1 {
    font-size: 20px;
  }

  .contacts-links {
    flex-direction: column;
    gap: 20px;
  }
}
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">мария евтодиева</div>

    <nav>
      <a href="#about">обо мне</a>
      <a href="#projects">проекты</a>
      <a href="#contacts">контакты</a>
    </nav>
  </header>

  <!-- ABOUT -->
  <section class="about" id="about">
    <h1>обо мне</h1>

    <div class="about-content">
      <div class="about-photo"></div>

      <div class="about-text">
        мультимедиа дизайнер. работаю с веб и материальным пространством,
        люблю смотреть на птиц.
      </div>
    </div>
  </section>
<!-- CONTACTS -->
<section class="contacts" id="contacts">
  <h1>связаться со мной</h1>

  <div class="contacts-links">
    <a href="mailto:maryevtodieva@gmail.com">почта ↗</a>
    <a href="mashacoder" target="_blank">github ↗</a>
    <a href="@mariaevtodieva" target="_blank">telegram ↗</a>
  </div>

  <div class="contacts-footer">
    © 2026 мария евтодиева
  </div>
</section>
</body>
</html>
